[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqms"
version = "0.2.0"
description = "Connects to a data pipeline's metadata and generates platform-neutral validation rules."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
dqms = "dqms.cli:main"

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20"]
azure-llm = ["openai>=1.30", "azure-identity>=1.16"]
snowflake = ["snowflake-connector-python>=3.7", "cryptography>=42"]
databricks = ["databricks-sql-connector>=3.0"]
files = ["pyarrow>=15"]
gcs = ["google-cloud-storage>=2.16"]
s3 = ["boto3>=1.34"]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.16"]
cloud = ["dqms[bigquery,snowflake,databricks,files,gcs,s3,azure]"]
dev = ["pytest>=8", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
dqms = ["api/static/*.html"]
