[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqms"
version = "0.2.0"
description = "Connects to a data pipeline's metadata and generates platform-neutral validation rules."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20"]
azure-llm = ["openai>=1.30", "azure-identity>=1.16"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
dqms = ["api/static/*.html"]
